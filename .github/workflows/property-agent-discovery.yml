name: Property Agency Discovery Agent
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      country_focus:
        description: 'Country focus: ethiopia, uk, us, all'
        required: false
        default: 'all'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: .github/agent-prompts/property-discovery.md
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNTRY_FOCUS: ${{ inputs.country_focus || 'all' }}
