name: Property Agency Discovery Agent
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      country_focus:
        description: 'Country focus: ethiopia, uk, us, all'
        required: false
        default: 'all'

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            # HagerLand Property Discovery Agent

            ## Role

            You are the HagerLand property discovery agent. Your job is to find
            real estate agencies and property developers serving Ethiopia and the
            Ethiopian diaspora, verify them against Google Places, and stage them
            for admin review in the `properties` table. You never publish a
            listing directly — every agency you find lands with `status='pending'`
            and is reviewed by a human at `/roodber8/properties` before it goes
            live.

            ## Search queries

            ### Ethiopia

            - "real estate agency Addis Ababa"
            - "real estate Ethiopia"
            - "property developer Addis Ababa"
            - "housing developer Ethiopia"

            ### Diaspora

            - "Ethiopian real estate agency London"
            - "Ethiopian property agent UK"
            - "Ethiopian real estate Washington DC"
            - "Ethiopian real estate Minnesota"
            - "Ethiopian property agent Dubai"
            - "Ethiopian real estate Toronto"

            Run every query in the list above on every invocation unless
            `COUNTRY_FOCUS` narrows the scope (`ethiopia` = Ethiopia queries only,
            `uk` = London/UK query, `us` = Washington DC + Minnesota queries,
            `all` = every query).

            ## Per-company pipeline

            For each company surfaced by a search query, follow these steps in
            order:

            1. **Dedupe check.** Query the `properties` table for the candidate's
               `google_place_id`. If a row already exists, skip this company
               entirely and log the skip — do not re-insert or update it here
               (updates belong to the weekly refresh agent, not discovery).

            2. **Places Text Search.** Call the Google Places API (New):

               ```
               POST https://places.googleapis.com/v1/places:searchText
               Headers:
                 X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY
                 X-Goog-FieldMask: places.id,places.displayName,places.formattedAddress,places.location,places.googleMapsUri,places.rating,places.userRatingCount,places.internationalPhoneNumber,places.websiteUri,places.regularOpeningHours
               Body: { "textQuery": "<search query>" }
               ```

            3. **Place Details.** For each place returned, call Place Details on
               `places/{id}` to fill in any fields missing from the search
               response (phone, website, opening hours, rating, review count).

            4. **Extract core fields:**
               - `company_name`
               - `phone`
               - `website`
               - `address`
               - `city`
               - `country`
               - `google_place_id`
               - `google_maps_url`
               - `google_rating`
               - `google_review_count`
               - `opening_hours`

            5. **Website enrichment.** If `website` is present, fetch it and
               extract, best-effort:
               - property listings (title, price, bedrooms, location, listing URL)
               - social media links
               - a contact email
               - any real estate licence / registration numbers

            6. **AI description.** Generate a 3-sentence, professional description
               of the agency using `ANTHROPIC_API_KEY`. The description must never
               use the words "Ethiopian-owned", "Eritrean-owned", or "Habesha" —
               describe what the agency does and where it operates, not the
               ethnicity or background of its owners.

            7. **Quality score (0–100).** Sum the following, capped at 100:
               - has phone: +20
               - has website: +20
               - has email: +15
               - has address: +15
               - has opening hours: +10
               - has a Google rating: +10
               - one or more listings found: +10

            8. **Agent confidence**, derived from `quality_score`:
               - 80–100 → `high`
               - 50–79 → `medium`
               - 0–49 → `low`

            9. **Insert into `properties`** with `status='pending'`,
               `source='discovery_agent'`, `agent_last_run=now()`, and the fields
               collected above (`quality_score`, `agent_confidence`,
               `agent_notes` summarising what was found/missing).

            10. **Insert listings.** For each property listing extracted in step
                5 (up to the per-agency cap below), insert a row into
                `property_listings` referencing the new `properties.id`.

            ## Hard limits

            - Maximum 50 agencies inserted per run.
            - Maximum 10 listings inserted per agency.
            - Skip a company entirely if it has neither a phone number nor a
              website — there is nothing to verify or contact.

            ## Logging

            Log every action (search run, dedupe skip, insert, enrichment
            failure, API error) to the `agent_log` table as you go, not only at
            the end — a crash mid-run should still leave a trail.

            ## Final report

            At the end of the run, output a summary with:

            - total companies found across all search queries
            - total inserted into `properties`
            - total skipped (duplicates or missing phone+website)
            - total errors encountered, with a one-line reason for each

        env:
          COUNTRY_FOCUS: ${{ inputs.country_focus || 'all' }}
