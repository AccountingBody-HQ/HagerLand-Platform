events {}
http {
  client_max_body_size 30m;
  server {
    listen 54321;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type, x-upsert, cache-control" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    if ($request_method = OPTIONS) { return 204; }
    location /auth/v1/ { proxy_pass http://127.0.0.1:54331/; proxy_set_header Host $host; }
    location /rest/v1/ { proxy_pass http://127.0.0.1:54330/; }
    location /storage/v1/ { proxy_pass http://127.0.0.1:54332/; proxy_set_header X-Forwarded-Prefix /storage/v1; proxy_set_header Host $host; }
  }
}
