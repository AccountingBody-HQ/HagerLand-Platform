name: hlstack
services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.004
    network_mode: host
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "port=54322"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost", "-p", "54322"]
      interval: 3s
      retries: 60
  auth:
    network_mode: host
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 54331
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@localhost:54322/postgres
      GOTRUE_SITE_URL: http://localhost:3100
      GOTRUE_URI_ALLOW_LIST: http://localhost:3100/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: hello@hagerland.test
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: x
      GOTRUE_SMTP_PASS: x
      GOTRUE_SMTP_SENDER_NAME: HagerLand
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_PASSWORD_MIN_LENGTH: 10
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
  rest:
    network_mode: host
    image: public.ecr.aws/supabase/postgrest:v16.4
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    environment:
      PGRST_SERVER_PORT: 54330
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@localhost:54322/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
  storage:
    network_mode: host
    image: public.ecr.aws/supabase/storage-api:v1.79.36
    depends_on: { db: { condition: service_healthy }, rest: { condition: service_started } }
    restart: unless-stopped
    environment:
      PORT: 54332
      SERVER_PORT: 54332
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_KEY}
      POSTGREST_URL: http://localhost:54330
      PGRST_JWT_SECRET: ${JWT_SECRET}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@localhost:54322/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    network_mode: host
  gateway:
    image: nginx:1.27-alpine
    depends_on: [auth, rest, storage]
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
